[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "warehouse-ai"
version = "0.1.0"
description = "AutoStore Warehouse Knowledge Assistant — RAG system with PySpark, Delta Lake, and LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-multipart>=0.0.9",
    "pyspark>=3.5,<4",
    "delta-spark>=3.0,<4",
    "chromadb-client>=0.5,<1",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "openai>=1.0,<2",
    "sentence-transformers>=3.0,<4",
    "pymupdf>=1.24,<2",
    "tiktoken>=0.7,<1",
    "sse-starlette>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
ui = [
    "streamlit>=1.35,<2",
    "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_llm: tests that require a real LLM API key",
]
